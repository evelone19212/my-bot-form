<!DOCTYPE html>
<html>
<head>
    <title>Переход на сайт банка</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            text-align: center;
        }
        
        .container {
            max-width: 400px;
            width: 100%;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .bank-name {
            font-size: 24px;
            font-weight: 600;
            margin: 20px 0;
            padding: 15px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
        }
        
        .button {
            display: block;
            width: 100%;
            padding: 18px;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            margin: 20px 0;
            box-sizing: border-box;
            cursor: pointer;
            border: none;
        }
        
        .button:hover {
            opacity: 0.9;
        }
        
        .close-btn {
            background: transparent;
            color: var(--tg-theme-text-color, #000000);
            border: 1px solid var(--tg-theme-hint-color, #dddddd);
            margin-top: 10px;
        }
        
        .note {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #888888);
            margin: 20px 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏦 Оформление карты</h1>
        
        <div class="bank-name" id="bankDisplay">Загрузка...</div>
        
        <p class="note">
            Нажмите кнопку ниже, чтобы открыть сайт банка.<br>
            Заполните заявку на официальном сайте.
        </p>
        
        <button class="button" id="openBankBtn">
            🌐 Открыть сайт банка
        </button>
        
        <button class="button close-btn" id="closeBtn">
            ✕ Закрыть
        </button>
        
        <p class="note">
            После заполнения заявки на сайте,<br>
            вы можете вернуться в бот.
        </p>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Растягиваем на весь экран
        
        // Получаем какой банк выбрал пользователь из URL
        const urlParams = new URLSearchParams(window.location.search);
        const bank = urlParams.get('bank') || 'tinkoff';
        
        // Настройки для банков (ЗАМЕНИТЕ НА СВОИ ПАРТНЕРСКИЕ ССЫЛКИ!)
        const bankData = {
            'tinkoff': {
                name: '🟢 Т-Банк',
                url: 'https://www.tinkoff.ru/'
            },
            'vtb': {
                name: '🔵 ВТБ',
                url: 'https://www.vtb.ru/'
            },
            'gazprom': {
                name: '💚 Газпромбанк',
                url: 'https://www.gazprombank.ru/'
            },
            'sber': {
                name: '💚 Сбербанк',
                url: 'https://www.sberbank.ru/'
            },
            'alfa': {
                name: '💛 Альфа-Банк',
                url: 'https://alfabank.ru/'
            }
        };
        
        // Получаем данные выбранного банка
        const currentBank = bankData[bank] || bankData['tinkoff'];
        
        // Показываем название банка
        document.getElementById('bankDisplay').textContent = currentBank.name;
        
        // Добавляем UTM-метки для отслеживания (чтобы банк знал, что клиент пришел от вас)
        const utmSource = '?utm_source=telegram_bot&utm_medium=referral&utm_campaign=' + bank;
        const fullUrl = currentBank.url + utmSource;
        
        console.log('Ссылка для открытия:', fullUrl);
        
        // Обработчик кнопки "Открыть сайт"
        document.getElementById('openBankBtn').addEventListener('click', function() {
            // ОТКРЫВАЕМ САЙТ ЧЕРЕЗ WINDOW.OPEN
            window.open(fullUrl, '_blank');
            
            // Отправляем данные в бот (что ссылка открыта)
            tg.sendData(JSON.stringify({
                action: 'link_opened',
                bank: bank,
                url: fullUrl
            }));
            
            // Показываем уведомление (вибрация)
            tg.HapticFeedback.notificationOccurred('success');
            
            // Меняем текст кнопки
            this.textContent = '✅ Сайт открыт! Вернитесь после заполнения';
            this.style.background = '#00a86b';
        });
        
        // Обработчик кнопки "Закрыть"
        document.getElementById('closeBtn').addEventListener('click', function() {
            tg.close();
        });
        
        // Отправляем событие об открытии мини-приложения
        tg.sendData(JSON.stringify({
            action: 'app_opened',
            bank: bank
        }));
        
    </script>
</body>
</html>
